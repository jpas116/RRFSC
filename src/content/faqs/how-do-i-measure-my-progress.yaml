question: "How do I measure my progress?"
group: Testing and progress
order: 1
answer: >-
  US Figure Skating tests mark each level, from Pre-Preliminary through Senior, with a separate adult track. Tests are optional for recreational skaters but required to compete at each level. See [Test Sessions](/skate-with-us/test-sessions) and the [USFS test structure](/docs/usfs-test-levels.pdf).
