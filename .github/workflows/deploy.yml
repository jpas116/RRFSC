name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild nightly (06:00 UTC, about 1am Eastern) so past sessions,
    # events and announcements drop off without anyone editing anything.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Remove this once www.rrfsc.org points at GitHub Pages and is set as the custom domain.
          SITE_BASE: /RRFSC
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
